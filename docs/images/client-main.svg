<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1040" viewBox="0 0 1560 1040" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Client 的四个业务 Service</title><desc id="desc">endpointService 只管注册信息，runService 自行连接并领取任务，sessionService 管原生会话复用，harnessService 管本地执行。四张本机表与只读页面分离。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="1560" height="1040" rx="16" fill="white"/>
<text x="30" y="40" font-size="25" fill="#0f172a" font-weight="600">Client：管理中心、原生会话、任务执行和 Harness 接入</text>
<text x="30" y="80" font-size="17" fill="#475569">Conversation 在 server；Session 是本地原生上下文，一个 Session 可以执行多个领来的 Run。</text>
<rect x="410" y="115" width="1120" height="875" rx="14" fill="#f5fff9" stroke="#cbd5e1"/>
<text x="430" y="147" font-size="18" fill="#065f46" font-weight="600">Device · Client（CLI 装配）</text>
<rect x="30" y="200" width="270" height="145" rx="10" fill="#eef2ff" stroke="#cbd5e1"/>
<text x="48" y="230" font-size="19" fill="#0f172a" font-weight="600">中心 A / Server</text>
<text x="48" y="262" font-size="15" fill="#475569">自己的 conversation / run</text>
<text x="48" y="288" font-size="15" fill="#475569">独立身份、凭据和连接</text>
<rect x="30" y="430" width="270" height="145" rx="10" fill="#eef2ff" stroke="#cbd5e1"/>
<text x="48" y="460" font-size="19" fill="#0f172a" font-weight="600">中心 B / Server</text>
<text x="48" y="492" font-size="15" fill="#475569">自己的 conversation / run</text>
<text x="48" y="518" font-size="15" fill="#475569">不共享其他中心的执行状态</text>
<rect x="450" y="180" width="300" height="145" rx="10" fill="#eef2ff" stroke="#cbd5e1"/>
<text x="468" y="210" font-size="19" fill="#0f172a" font-weight="600">runService</text>
<text x="468" y="242" font-size="15" fill="#475569">自行连接各 Server，领取任务</text>
<text x="468" y="268" font-size="15" fill="#475569">共享容量、交互、执行与账本</text>
<text x="468" y="294" font-size="15" fill="#475569">本机 runs / run_settings</text>
<rect x="830" y="180" width="300" height="145" rx="10" fill="#eef2ff" stroke="#cbd5e1"/>
<text x="848" y="210" font-size="19" fill="#0f172a" font-weight="600">endpointService</text>
<text x="848" y="242" font-size="15" fill="#475569">只保存向哪些 Server 注册了</text>
<text x="848" y="268" font-size="15" fill="#475569">地址、设备身份与凭据</text>
<text x="848" y="294" font-size="15" fill="#475569">本机 endpoints</text>
<rect x="830" y="420" width="300" height="145" rx="10" fill="#eef2ff" stroke="#cbd5e1"/>
<text x="848" y="450" font-size="19" fill="#0f172a" font-weight="600">sessionService</text>
<text x="848" y="482" font-size="15" fill="#475569">原生会话创建 / 恢复 / 复用</text>
<text x="848" y="508" font-size="15" fill="#475569">同 session 串行执行多个 run</text>
<text x="848" y="534" font-size="15" fill="#475569">本机 sessions</text>
<rect x="1210" y="420" width="300" height="145" rx="10" fill="#eef2ff" stroke="#cbd5e1"/>
<text x="1228" y="450" font-size="19" fill="#0f172a" font-weight="600">harnessService</text>
<text x="1228" y="482" font-size="15" fill="#475569">本地 YAML / hook / skill</text>
<text x="1228" y="508" font-size="15" fill="#475569">原生协议与输出解释</text>
<text x="1228" y="534" font-size="15" fill="#475569">不通过 server 驱动原生命令</text>
<path d="M300 260 H450" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="325" y="240" font-size="13" fill="#475569">业务连接</text>
<path d="M300 500 H380 V290 H450" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<path d="M750 250 H830" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="760" y="230" font-size="13" fill="#475569">读取</text>
<path d="M650 325 V380 H980 V420" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<path d="M1130 490 H1210" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<path d="M750 285 H780 V365 H1360 V420" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="1215" y="350" font-size="14" fill="#475569">本次执行</text>
<rect x="1210" y="625" width="300" height="120" rx="10" fill="#fffbeb" stroke="#cbd5e1"/>
<text x="1228" y="655" font-size="19" fill="#0f172a" font-weight="600">原生程序 / 会话历史</text>
<text x="1228" y="687" font-size="15" fill="#475569">Codex thread / Claude session</text>
<text x="1228" y="713" font-size="15" fill="#475569">run 完成后历史仍可保留</text>
<path d="M1360 565 V625" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="450" y="790" width="680" height="150" rx="10" fill="#ecfdf5" stroke="#cbd5e1"/>
<text x="468" y="820" font-size="19" fill="#0f172a" font-weight="600">本机 store · SQLite</text>
<text x="468" y="852" font-size="15" fill="#475569">endpoints：注册信息；run_settings：执行容量</text>
<text x="468" y="878" font-size="15" fill="#475569">sessions：原生会话映射；runs：每次任务执行记录</text>
<text x="468" y="904" font-size="15" fill="#475569">不使用 server 数据库；Reader 不暴露设备密钥</text>
<path d="M600 325 V790" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="615" y="680" font-size="14" fill="#475569">runs / run_settings</text>
<path d="M900 325 V380 H790 V790" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="800" y="720" font-size="14" fill="#475569">endpoints</text>
<path d="M980 565 V790" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="995" y="680" font-size="14" fill="#475569">会话存储</text>
<rect x="1210" y="815" width="300" height="125" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="1228" y="845" font-size="19" fill="#0f172a" font-weight="600">只读 controller + 网页</text>
<text x="1228" y="877" font-size="15" fill="#475569">session / 执行清单 / 用量</text>
<text x="1228" y="903" font-size="15" fill="#475569">只拿只读 Reader，不控制执行</text>
<path d="M1210 880 H1130" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="1142" y="862" font-size="13" fill="#475569">Reader</text>
<text x="450" y="970" font-size="16" fill="#475569">四个 Service 管业务；连接循环、原生协议原语都是内部机制，不是并列顶层服务。</text>
</svg>

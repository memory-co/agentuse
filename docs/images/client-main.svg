<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b"/>
    </marker>
  </defs>
  <rect width="1500" height="1040" fill="#fff"/>
  <g font-family="sans-serif" fill="#0f172a">
    <text x="45" y="48" font-size="30">Client：五个 Service，文件是唯一持久化事实</text>
    <rect x="45" y="85" width="1410" height="95" rx="14" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="65" y="119" font-size="23">CLI / 本机页面</text>
    <text x="65" y="152" font-size="17">services.go 装配五个 service；平台记录只读，local 通过 runService 调试本机适配器。</text>
    <rect x="45" y="225" width="420" height="135" rx="14" fill="#eff6ff" stroke="#94a3b8"/>
    <text x="65" y="259" font-size="23">endpointService</text>
    <text x="65" y="292" font-size="17">内置 local 与平台注册 / device 身份与凭据</text>
    <text x="65" y="319" font-size="17">统一提供 local / 平台模式，不连接、不领任务</text>
    <rect x="535" y="225" width="430" height="135" rx="14" fill="#eff6ff" stroke="#94a3b8"/>
    <text x="555" y="259" font-size="23">settingService</text>
    <text x="555" y="292" font-size="17">本机端口、session 默认父目录</text>
    <text x="555" y="319" font-size="17">声明 quota 即自动清理，无独立清理配置</text>
    <rect x="1035" y="225" width="420" height="135" rx="14" fill="#fff7ed" stroke="#94a3b8"/>
    <text x="1055" y="259" font-size="23">Server（多个 endpoint）</text>
    <text x="1055" y="292" font-size="17">conversation / run / fileService</text>
    <text x="1055" y="319" font-size="17">只交换业务协议，不下发执行命令</text>
    <rect x="45" y="440" width="420" height="170" rx="14" fill="#eff6ff" stroke="#94a3b8"/>
    <text x="65" y="474" font-size="23">runService</text>
    <text x="65" y="507" font-size="17">连接、心跳、领取、全局容量与上报</text>
    <text x="65" y="534" font-size="17">持久化每次执行尝试；触发目录检查</text>
    <text x="65" y="561" font-size="17">读取 endpointService / settingService</text>
    <rect x="535" y="440" width="430" height="170" rx="14" fill="#eff6ff" stroke="#94a3b8"/>
    <text x="555" y="474" font-size="23">sessionService</text>
    <text x="555" y="507" font-size="17">原生 Session 复用；统一分配共享目录</text>
    <text x="555" y="534" font-size="17">按 Conversation 推导与回收工作区</text>
    <text x="555" y="561" font-size="17">一份 Session 可承载若干 Run</text>
    <rect x="1035" y="440" width="420" height="170" rx="14" fill="#eff6ff" stroke="#94a3b8"/>
    <text x="1055" y="474" font-size="23">harnessService</text>
    <text x="1055" y="507" font-size="17">Codex / Claude Code 本地适配</text>
    <text x="1055" y="534" font-size="17">创建 / 恢复 / 执行 / 插话 / 取消</text>
    <text x="1055" y="561" font-size="17">本地 YAML、RPC、hook 与 skill</text>
    <path d="M255,360 L255,440" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <path d="M750,360 L750,440" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <path d="M1245,360 L1245,395 L350,395 L350,440" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <path d="M465,530 L535,530" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <path d="M965,530 L1035,530" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <rect x="45" y="690" width="920" height="170" rx="14" fill="#ecfdf5" stroke="#94a3b8"/>
    <text x="65" y="724" font-size="23">~/.agentuse/：配置与状态文件</text>
    <text x="65" y="757" font-size="17">endpoints.yaml → endpointService      setting.yaml → settingService</text>
    <text x="65" y="784" font-size="17">session.yaml → sessionService；路径由配置及 ID 推导</text>
    <text x="65" y="811" font-size="17">工作区内 sessions/&lt;session&gt;/runs/&lt;run&gt;/&lt;attempt&gt;/run.json</text>
    <rect x="1035" y="690" width="420" height="170" rx="14" fill="#ecfdf5" stroke="#94a3b8"/>
    <text x="1055" y="724" font-size="23">Conversation：workspace/ 与 sessions/</text>
    <text x="1055" y="757" font-size="17">所有 Codex、Claude Code 从 workspace/ 启动</text>
    <text x="1055" y="784" font-size="17">任一 Session 在用时整个目录受保护</text>
    <text x="1055" y="811" font-size="17">空闲 Conversation 目录整体回收</text>
    <path d="M255,610 L255,690" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <path d="M750,610 L750,690" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <path d="M1245,610 L1245,690" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <rect x="45" y="910" width="1410" height="95" rx="14" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="65" y="944" font-size="23">持久化与恢复原则</text>
    <text x="65" y="977" font-size="17">原子替换、排他写入；内存索引可重建；不设 SQLite。重启核对 server / 原生状态，不能凭旧 running 自动重跑。</text>
  </g>
</svg>

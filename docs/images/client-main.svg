<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Client 整体结构</title><desc id="desc">主循环维护 server 业务连接，Run 管理调用本地 harnessService 执行，执行记录写入本机账本，只读 controller 通过 Reader 展示网页。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="1400" height="940" rx="16" fill="white"/>
<text x="30" y="42" font-size="25" fill="#0f172a" font-weight="600">Client：领任务、本地执行、上报与只读账本</text>
<text x="30" y="80" font-size="17" fill="#475569">Server 管业务状态；原生命令、RPC、hook 和 skill 都留在设备本地。</text>
<rect x="390" y="115" width="980" height="715" rx="14" fill="#f5fff9" stroke="#a7d8bf"/>
<text x="410" y="148" font-size="18" fill="#065f46" font-weight="600">Device · Client（CLI 装配）</text>
<rect x="30" y="190" width="280" height="210" rx="10" fill="#eef2ff" stroke="#cbd5e1"/>
<text x="48" y="220" font-size="19" fill="#0f172a" font-weight="600">Server</text>
<text x="48" y="250" font-size="15" fill="#475569">device / session / run / work</text>
<text x="48" y="275" font-size="15" fill="#475569">WebSocket：任务与标准事件</text>
<text x="48" y="300" font-size="15" fill="#475569">HTTP：共享历史与文件</text>
<text x="48" y="325" font-size="15" fill="#475569">不下发执行命令或脚本</text>
<rect x="420" y="185" width="280" height="140" rx="10" fill="#eef2ff" stroke="#cbd5e1"/>
<text x="438" y="215" font-size="19" fill="#0f172a" font-weight="600">主循环</text>
<text x="438" y="245" font-size="15" fill="#475569">连接、能力上报、ready</text>
<text x="438" y="270" font-size="15" fill="#475569">心跳、重连、执行对账</text>
<rect x="740" y="185" width="280" height="140" rx="10" fill="#eef2ff" stroke="#cbd5e1"/>
<text x="758" y="215" font-size="19" fill="#0f172a" font-weight="600">Run 管理</text>
<text x="758" y="245" font-size="15" fill="#475569">按 run/attempt 路由交互</text>
<text x="758" y="270" font-size="15" fill="#475569">准备输入、控制执行生命周期</text>
<rect x="1060" y="185" width="280" height="140" rx="10" fill="#eef2ff" stroke="#cbd5e1"/>
<text x="1078" y="215" font-size="19" fill="#0f172a" font-weight="600">harnessService</text>
<text x="1078" y="245" font-size="15" fill="#475569">解析本地接入包与原生交互</text>
<text x="1078" y="270" font-size="15" fill="#475569">生成标准进度、问题和结果</text>
<path d="M310 245 H420" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="325" y="228" font-size="13" fill="#475569">任务</text>
<path d="M420 300 H310" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="325" y="283" font-size="13" fill="#475569">事件</text>
<path d="M700 250 H740" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<path d="M1020 250 H1060" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="1060" y="375" width="280" height="110" rx="10" fill="#fffbeb" stroke="#cbd5e1"/>
<text x="1078" y="405" font-size="19" fill="#0f172a" font-weight="600">原生程序 / 桥接资源</text>
<text x="1078" y="435" font-size="15" fill="#475569">进程、RPC、hook、skill</text>
<text x="1078" y="460" font-size="15" fill="#475569">Codex / Claude Code / 其他</text>
<path d="M1200 325 V375" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="420" y="565" width="280" height="145" rx="10" fill="#fffbeb" stroke="#cbd5e1"/>
<text x="438" y="595" font-size="19" fill="#0f172a" font-weight="600">本地配置与接入包</text>
<text x="438" y="625" font-size="15" fill="#475569">设备凭据、程序路径</text>
<text x="438" y="650" font-size="15" fill="#475569">YAML / hook / skill / 指令</text>
<text x="438" y="675" font-size="15" fill="#475569">包版本由本地维护</text>
<rect x="740" y="565" width="280" height="145" rx="10" fill="#ecfdf5" stroke="#cbd5e1"/>
<text x="758" y="595" font-size="19" fill="#0f172a" font-weight="600">本机 store · 执行账本</text>
<text x="758" y="625" font-size="15" fill="#475569">run/attempt、状态与摘要</text>
<text x="758" y="650" font-size="15" fill="#475569">用量、耗时、目录与错误</text>
<text x="758" y="675" font-size="15" fill="#475569">Writer / Reader 分离</text>
<rect x="1060" y="565" width="280" height="145" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="1078" y="595" font-size="19" fill="#0f172a" font-weight="600">只读 controller + 网页</text>
<text x="1078" y="625" font-size="15" fill="#475569">GET · 只拿 store.Reader</text>
<text x="1078" y="650" font-size="15" fill="#475569">执行清单 / 用量统计</text>
<text x="1078" y="675" font-size="15" fill="#475569">不调用执行 service</text>
<path d="M880 325 V565" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="895" y="470" font-size="14" fill="#475569">store.Writer</text>
<path d="M1060 625 H1020" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="1025" y="605" font-size="12" fill="#475569">只读</text>
<path d="M560 565 V325" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="575" y="475" font-size="14" fill="#475569">配置 / 资源</text>
<text x="420" y="780" font-size="16" fill="#475569">Session 共享业务文件；每个 run/attempt 的控制资源独立准备。</text>
<text x="30" y="878" font-size="17" fill="#475569">本机页面只读账本，不能启动或取消任务；本机账本也不是 server 的任务队列。</text>
<text x="30" y="913" font-size="17" fill="#475569">controller 与执行 service 不互相调用，唯一数据交集是 store.Reader / Writer。</text>
</svg>

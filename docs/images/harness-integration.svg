<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="850" viewBox="0 0 1360 850" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Harness 接入包与通用 Client</title><desc id="desc">YAML 留在 server，server 编译执行描述并分发按需 hook 和 skill 资源。Client 仅运行通用执行原语，原生 harness 由接入包映射。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="1360" height="850" rx="16" fill="white"/>
<text x="30" y="40" font-size="25" fill="#0f172a" font-weight="600">一个接入包，不只是一个 YAML</text>
<text x="30" y="78" font-size="17" fill="#475569">YAML 声明；hook / 桥接程序接入本地行为；skill 指导业务工具使用。</text>
<rect x="30" y="135" width="350" height="205" rx="10" fill="#eef2ff" stroke="#cbd5e1"/>
<text x="48" y="165" font-size="19" fill="#0f172a" font-weight="600">Server · harnessService</text>
<text x="48" y="195" font-size="15" fill="#475569">harness.yaml：规则与能力</text>
<text x="48" y="220" font-size="15" fill="#475569">hooks/：按需本地桥接资源</text>
<text x="48" y="245" font-size="15" fill="#475569">skills/：文件与工作操作指导</text>
<text x="48" y="270" font-size="15" fill="#475569">instructions/：本次执行说明</text>
<rect x="500" y="135" width="350" height="205" rx="10" fill="#ecfdf5" stroke="#cbd5e1"/>
<text x="518" y="165" font-size="19" fill="#0f172a" font-weight="600">Device · 通用 Client</text>
<text x="518" y="195" font-size="15" fill="#475569">执行描述：程序 / 参数 / 通道</text>
<text x="518" y="220" font-size="15" fill="#475569">准备版本化资源与工作目录</text>
<text x="518" y="245" font-size="15" fill="#475569">进程流 / RPC / 本地回调</text>
<text x="518" y="270" font-size="15" fill="#475569">不解析 YAML，不按 harness 分支</text>
<rect x="970" y="135" width="350" height="205" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="988" y="165" font-size="19" fill="#0f172a" font-weight="600">原生 Harness</text>
<text x="988" y="195" font-size="15" fill="#475569">Codex：持续 app-server RPC</text>
<text x="988" y="220" font-size="15" fill="#475569">Claude Code：stream + hook</text>
<text x="988" y="245" font-size="15" fill="#475569">原生程序加载指令 / skill</text>
<text x="988" y="270" font-size="15" fill="#475569">具体语义由 server 映射</text>
<path d="M380 220 L500 220" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="390" y="198" font-size="13" fill="#475569">描述 + 资源</text>
<path d="M850 220 L970 220" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="860" y="198" font-size="13" fill="#475569">通用 I/O</text>
<path d="M970 300 L850 300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<path d="M500 300 L380 300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="390" y="370" font-size="16" fill="#475569">← 原始输出、RPC 帧、hook 回调；server 归一化为业务事件</text>
<rect x="30" y="435" width="350" height="160" rx="10" fill="#eef2ff" stroke="#cbd5e1"/>
<text x="48" y="465" font-size="19" fill="#0f172a" font-weight="600">Server 控制面</text>
<text x="48" y="495" font-size="15" fill="#475569">runService：任务状态与消费确认</text>
<text x="48" y="520" font-size="15" fill="#475569">sessionService：共享消息与回复</text>
<text x="48" y="545" font-size="15" fill="#475569">fileService / workService：业务操作</text>
<rect x="500" y="435" width="350" height="160" rx="10" fill="#fffbeb" stroke="#cbd5e1"/>
<text x="518" y="465" font-size="19" fill="#0f172a" font-weight="600">本地桥接资源（可选）</text>
<text x="518" y="495" font-size="15" fill="#475569">由接入包提供并按清单运行</text>
<text x="518" y="520" font-size="15" fill="#475569">stdin / stdout 或本地 HTTP</text>
<text x="518" y="545" font-size="15" fill="#475569">只封装与转发，不写服务端表</text>
<rect x="970" y="435" width="350" height="160" rx="10" fill="#fffbeb" stroke="#cbd5e1"/>
<text x="988" y="465" font-size="19" fill="#0f172a" font-weight="600">Skill / 指令（按需）</text>
<text x="988" y="495" font-size="15" fill="#475569">指导 agent 使用标准业务入口</text>
<text x="988" y="520" font-size="15" fill="#475569">文件路径写入 attachments</text>
<text x="988" y="545" font-size="15" fill="#475569">不负责 ACK、超时或取消</text>
<path d="M500 510 L380 510" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="395" y="488" font-size="13" fill="#475569">标准交互</text>
<path d="M675 340 L675 435" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="690" y="403" font-size="13" fill="#475569">准备 / 运行</text>
<path d="M1150 435 L1150 340" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="1165" y="403" font-size="13" fill="#475569">按配置加载</text>
<text x="30" y="690" font-size="17" fill="#475569">探测：server 发命令 → client 执行 → server 解释；client 无需内置 harness 列表。</text>
<text x="30" y="731" font-size="17" fill="#475569">交互：缺失原生能力时明确降级；不能用 skill 假装实现插话或提问。</text>
<text x="30" y="772" font-size="17" fill="#92400e">确认：通道接收 ≠ 原生接入点接收 ≠ 模型已理解并完成。</text>
</svg>

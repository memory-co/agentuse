<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="850" viewBox="0 0 1360 850" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Client 本地 Harness 接入包</title><desc id="desc">Server 下发任务而非执行脚本。Client harnessService 解析本地 YAML、准备 hook 和 skill，并与本地原生程序交互后上报标准业务事件。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="1360" height="850" rx="16" fill="white"/>
<text x="30" y="40" font-size="25" fill="#0f172a" font-weight="600">Harness 的整个执行链在设备本地</text>
<text x="30" y="78" font-size="17" fill="#475569">YAML、原生 RPC、hook 回调、桥接脚本和 skill 不通过 server WebSocket。</text>
<rect x="435" y="115" width="895" height="655" rx="12" fill="#f5fff9" stroke="#cbd5e1"/>
<text x="455" y="150" font-size="19" fill="#065f46" font-weight="600">Device 本地边界</text>
<rect x="30" y="210" width="300" height="180" rx="12" fill="#eef2ff" stroke="#cbd5e1"/>
<text x="48" y="239" font-size="19" fill="#0f172a" font-weight="600">Server · runService</text>
<text x="48" y="268" font-size="15" fill="#475569">下发业务 run 和输入</text>
<text x="48" y="292" font-size="15" fill="#475569">传递补充消息 / 答案 / 取消</text>
<text x="48" y="316" font-size="15" fill="#475569">保存标准进度 / 问题 / 结果</text>
<rect x="465" y="210" width="405" height="180" rx="12" fill="#ecfdf5" stroke="#cbd5e1"/>
<text x="483" y="239" font-size="19" fill="#0f172a" font-weight="600">Client · harnessService</text>
<text x="483" y="268" font-size="15" fill="#475569">解析本地 YAML，探测与执行</text>
<text x="483" y="292" font-size="15" fill="#475569">管理原生 RPC / hook / 工具请求</text>
<text x="483" y="316" font-size="15" fill="#475569">将本地输出归一化为业务事件</text>
<rect x="990" y="210" width="310" height="180" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="1008" y="239" font-size="19" fill="#0f172a" font-weight="600">原生 Harness</text>
<text x="1008" y="268" font-size="15" fill="#475569">Codex：持续 app-server RPC</text>
<text x="1008" y="292" font-size="15" fill="#475569">Claude Code：stream + hook</text>
<text x="1008" y="316" font-size="15" fill="#475569">其他：本地接入包适配</text>
<path d="M330 260 H465" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="342" y="240" font-size="14" fill="#475569">run 业务任务</text>
<path d="M465 355 H330" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="346" y="335" font-size="14" fill="#475569">标准事件</text>
<path d="M870 260 H990" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="878" y="240" font-size="14" fill="#475569">本地原生 I/O</text>
<path d="M990 355 H870" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="465" y="485" width="405" height="180" rx="12" fill="#fffbeb" stroke="#cbd5e1"/>
<text x="483" y="514" font-size="19" fill="#0f172a" font-weight="600">本地接入包</text>
<text x="483" y="543" font-size="15" fill="#475569">harness.yaml：命令与交互映射</text>
<text x="483" y="567" font-size="15" fill="#475569">hooks/：按需桥接程序</text>
<text x="483" y="591" font-size="15" fill="#475569">skills/：业务操作指导</text>
<text x="483" y="615" font-size="15" fill="#475569">instructions/：工作与上下文规则</text>
<rect x="990" y="485" width="310" height="180" rx="12" fill="#fffbeb" stroke="#cbd5e1"/>
<text x="1008" y="514" font-size="19" fill="#0f172a" font-weight="600">Skill 不替代协议</text>
<text x="1008" y="543" font-size="15" fill="#475569">文件 / 工作线程操作说明</text>
<text x="1008" y="567" font-size="15" fill="#475569">不保证模型必然调用工具</text>
<text x="1008" y="591" font-size="15" fill="#475569">不确认插话，不取消进程</text>
<path d="M665 485 V390" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<path d="M1145 485 V390" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="30" y="720" font-size="16" fill="#475569">WebSocket 不充当远程 shell，也不转发原生 RPC；业务层无需知道 turn/steer 或 hook JSON。</text>
<text x="30" y="814" font-size="17" fill="#475569">本地包安装/升级与版本保留由 client 管理；server 只记录上报标识、版本和能力。</text>
</svg>

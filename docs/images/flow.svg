<svg xmlns="http://www.w3.org/2000/svg" width="920" height="250" viewBox="0 0 920 250" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="920" height="250" rx="16" fill="#ffffff"/>
  <text x="30" y="40" font-size="16" font-weight="700" fill="#0f172a">从接入到干活</text>

  <g font-size="12.5" fill="#475569">
    <!-- 1 -->
    <rect x="30" y="64" width="155" height="150" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="56" cy="90" r="14" fill="#6366f1"/><text x="56" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
    <text x="78" y="95" font-size="15" font-weight="600" fill="#0f172a">添加机器</text>
    <text x="44" y="128">在网页上点</text>
    <text x="44" y="148">「添加 daemon」</text>
    <text x="44" y="168">拿到一条安装命令</text>

    <!-- 2 -->
    <rect x="207" y="64" width="155" height="150" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="233" cy="90" r="14" fill="#6366f1"/><text x="233" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
    <text x="255" y="95" font-size="15" font-weight="600" fill="#0f172a">一行命令</text>
    <rect x="219" y="114" width="131" height="26" rx="5" fill="#0f172a"/>
    <text x="227" y="132" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#a5f3fc">$ curl …/setup.sh</text>
    <text x="221" y="166">注册并装成后台服务</text>
    <text x="221" y="186">几秒后显示「在线」</text>

    <!-- 3 -->
    <rect x="384" y="64" width="155" height="150" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="410" cy="90" r="14" fill="#6366f1"/><text x="410" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
    <text x="432" y="95" font-size="15" font-weight="600" fill="#0f172a">开 harness</text>
    <text x="398" y="128">自动检测本机的</text>
    <text x="398" y="148">claude / codex …</text>
    <text x="398" y="168">逐个打开开关</text>

    <!-- 4 -->
    <rect x="561" y="64" width="155" height="150" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="587" cy="90" r="14" fill="#6366f1"/><text x="587" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
    <text x="609" y="95" font-size="15" font-weight="600" fill="#0f172a">建 agent</text>
    <text x="575" y="128">起个名字，比如</text>
    <text x="575" y="148" font-family="ui-monospace, Menlo, monospace" fill="#4f46e5">@code-helper</text>
    <text x="575" y="168">背后的 harness 随时换</text>

    <!-- 5 -->
    <rect x="738" y="64" width="155" height="150" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
    <circle cx="764" cy="90" r="14" fill="#22c55e"/><text x="764" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text>
    <text x="786" y="95" font-size="15" font-weight="600" fill="#0f172a">开会话</text>
    <text x="752" y="128">发 prompt → 派到</text>
    <text x="752" y="148">主人的 daemon 上跑</text>
    <text x="752" y="168">进度实时回来</text>
    <text x="752" y="188">可以一直接着聊</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.6" marker-end="url(#b)">
    <line x1="187" y1="139" x2="204" y2="139"/>
    <line x1="364" y1="139" x2="381" y2="139"/>
    <line x1="541" y1="139" x2="558" y2="139"/>
    <line x1="718" y1="139" x2="735" y2="139"/>
  </g>
  <text x="460" y="238" text-anchor="middle" font-size="12" fill="#94a3b8">会话对齐 harness 自己的 session（Claude Code session / Codex thread），在同一台电脑上续接</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="960" viewBox="0 0 1520 960" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">V3 Server 业务 Service 关系</title><desc id="desc">Controller 和设备连接入口调用业务 service。sessionService 编排消息并调用 runService，执行结果通过事件返回，其他 service 管理用户、设备、agent、harness、附件和工作。Message 和 run 为 N:M 关系。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="1520" height="960" rx="16" fill="white"/>
<text x="30" y="42" font-size="25" fill="#0f172a" font-weight="600">Server：对话、执行与业务 Service</text>
<text x="30" y="79" font-size="16" fill="#475569">目标设计 · device 是设备，client 是设备上运行的程序</text>
<rect x="370" y="125" width="770" height="685" rx="10" fill="#fafaff" stroke="#a5b4fc"/>
<text x="392" y="154" font-size="17" fill="#3730a3" font-weight="600">service：业务职责与组合</text>
<rect x="400" y="210" width="335" height="160" rx="10" fill="#eef2ff" stroke="#cbd5e1"/>
<text x="418" y="239" font-size="20" fill="#0f172a" font-weight="600">sessionService</text>
<text x="418" y="267" font-size="15" fill="#475569">sessions / messages</text>
<text x="418" y="292" font-size="15" fill="#475569">保存对话，编排发送消息</text>
<text x="418" y="317" font-size="15" fill="#475569">接收结果事件，保存最终回复</text>
<rect x="775" y="210" width="335" height="160" rx="10" fill="#eef2ff" stroke="#cbd5e1"/>
<text x="793" y="239" font-size="20" fill="#0f172a" font-weight="600">runService</text>
<text x="793" y="267" font-size="15" fill="#475569">runs / run_prompt / events</text>
<text x="793" y="292" font-size="15" fill="#475569">任务分配、执行、交互和恢复</text>
<text x="793" y="317" font-size="15" fill="#475569">完成后发出结果事件</text>
<path d="M735 255 H775" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="605" y="192" font-size="14" fill="#475569">调用：建立任务分配</text>
<path d="M775 345 H735" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="590" y="400" font-size="14" fill="#475569">事件：执行结果 → 回复入会话</text>
<text x="450" y="441" font-size="16" fill="#3730a3">message ↔ run_prompt ↔ run：N:M；同一个 session 下的共享历史与执行</text>
<rect x="400" y="470" width="335" height="85" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="418" y="499" font-size="20" fill="#0f172a" font-weight="600">userService</text>
<text x="418" y="527" font-size="15" fill="#475569">用户、角色、令牌</text>
<rect x="775" y="470" width="335" height="85" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="793" y="499" font-size="20" fill="#0f172a" font-weight="600">deviceService</text>
<text x="793" y="527" font-size="15" fill="#475569">设备、在线状态、运行能力</text>
<rect x="400" y="580" width="335" height="85" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="418" y="609" font-size="20" fill="#0f172a" font-weight="600">agentService</text>
<text x="418" y="637" font-size="15" fill="#475569">任务角色及 device / harness 选择</text>
<rect x="775" y="580" width="335" height="85" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="793" y="609" font-size="20" fill="#0f172a" font-weight="600">harnessService</text>
<text x="793" y="637" font-size="15" fill="#475569">YAML config → client 可理解的执行描述</text>
<rect x="400" y="690" width="335" height="85" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="418" y="719" font-size="20" fill="#0f172a" font-weight="600">attachmentService</text>
<text x="418" y="747" font-size="15" fill="#475569">共享附件、配额与正文文件</text>
<rect x="775" y="690" width="335" height="85" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="793" y="719" font-size="20" fill="#0f172a" font-weight="600">workService</text>
<text x="793" y="747" font-size="15" fill="#475569">协调 session、线程及结果汇总</text>
<rect x="30" y="220" width="270" height="135" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="48" y="249" font-size="20" fill="#0f172a" font-weight="600">controller · HTTP</text>
<text x="48" y="277" font-size="15" fill="#475569">身份、请求、响应</text>
<text x="48" y="302" font-size="15" fill="#475569">网页 / SDK / CLI 入口</text>
<rect x="30" y="490" width="270" height="135" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="48" y="519" font-size="20" fill="#0f172a" font-weight="600">设备连接入口</text>
<text x="48" y="547" font-size="15" fill="#475569">连接与协议收发</text>
<text x="48" y="572" font-size="15" fill="#475569">领任务、交互、上报事件</text>
<path d="M300 285 H370" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<path d="M300 550 H370" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="1200" y="220" width="290" height="330" rx="10" fill="#ecfdf5" stroke="#cbd5e1"/>
<text x="1218" y="249" font-size="20" fill="#0f172a" font-weight="600">store</text>
<text x="1218" y="277" font-size="15" fill="#475569">users / devices</text>
<text x="1218" y="302" font-size="15" fill="#475569">device_harnesses / capabilities</text>
<text x="1218" y="327" font-size="15" fill="#475569">agents / harnesses</text>
<text x="1218" y="352" font-size="15" fill="#475569">sessions / messages</text>
<text x="1218" y="377" font-size="15" fill="#475569">runs / run_prompt</text>
<text x="1218" y="402" font-size="15" fill="#475569">run_events / run_questions</text>
<text x="1218" y="427" font-size="15" fill="#475569">attachments / works</text>
<text x="1218" y="452" font-size="15" fill="#475569">及消息、工作相关辅助表</text>
<path d="M1140 380 H1200" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="1200" y="590" width="290" height="110" rx="10" fill="#ecfdf5" stroke="#cbd5e1"/>
<text x="1218" y="619" font-size="20" fill="#0f172a" font-weight="600">附件正文 / YAML</text>
<text x="1218" y="647" font-size="15" fill="#475569">文件数据和配置描述</text>
<text x="1218" y="672" font-size="15" fill="#475569">由对应业务 service 管理</text>
<rect x="30" y="720" width="270" height="110" rx="10" fill="#fffbeb" stroke="#cbd5e1"/>
<text x="48" y="749" font-size="20" fill="#0f172a" font-weight="600">client @ device</text>
<text x="48" y="777" font-size="15" fill="#475569">领取统一 run，读取 YAML</text>
<text x="48" y="802" font-size="15" fill="#475569">调用本机 harness，回报结果</text>
<path d="M110 625 V720" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<path d="M215 720 V625" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="35" y="873" font-size="17" fill="#475569">关系：用户拥有设备和 agent；agent 选择 device + harness；session 包含 message 与 run。</text>
<text x="35" y="910" font-size="16" fill="#475569">图中 service 是业务划分；具体调用关系见正文。提交后通过通知接口向设备推送任务和交互。</text>
</svg>

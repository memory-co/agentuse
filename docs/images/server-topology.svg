<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="970" viewBox="0 0 1560 970" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Server 負責 Run，Client 負責 Harness</title><desc id="desc">服務端管理對話、設備和 run。客戶端本地管理 YAML、原生執行和交互。WebSocket 僅傳任務、業務動作和標準結果。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="1560" height="970" rx="16" fill="white"/>
<text x="30" y="40" font-size="25" fill="#0f172a" font-weight="600">V3：Server 到 Run 爲止，Harness 執行留在 Client</text>
<text x="30" y="78" font-size="17" fill="#475569">WebSocket：輸入 / 答案 / 取消 ↔ 標準事件；不傳原生執行命令或控制幀。</text>
<rect x="25" y="115" width="1010" height="765" rx="12" fill="#fafaff" stroke="#cbd5e1"/>
<text x="45" y="150" font-size="20" fill="#3730a3" font-weight="600">Server · 業務服務與存儲</text>
<rect x="45" y="190" width="255" height="130" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="63" y="219" font-size="19" fill="#0f172a" font-weight="600">controller · HTTP</text>
<text x="63" y="248" font-size="15" fill="#475569">身份、業務請求與響應</text>
<text x="63" y="272" font-size="15" fill="#475569">網頁 / SDK / CLI 入口</text>
<rect x="45" y="455" width="255" height="130" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="63" y="484" font-size="19" fill="#0f172a" font-weight="600">device 連接入口</text>
<text x="63" y="513" font-size="15" fill="#475569">業務輸入分配與公共事件接收</text>
<text x="63" y="537" font-size="15" fill="#475569">不解釋原生 harness 協議</text>
<rect x="350" y="190" width="305" height="130" rx="12" fill="#eef2ff" stroke="#cbd5e1"/>
<text x="368" y="219" font-size="19" fill="#0f172a" font-weight="600">conversationService</text>
<text x="368" y="248" font-size="15" fill="#475569">conversations / messages</text>
<text x="368" y="272" font-size="15" fill="#475569">保存對話，編排消息發送</text>
<text x="368" y="296" font-size="15" fill="#475569">接收結果並保存回覆</text>
<rect x="700" y="190" width="305" height="130" rx="12" fill="#eef2ff" stroke="#cbd5e1"/>
<text x="718" y="219" font-size="19" fill="#0f172a" font-weight="600">runService</text>
<text x="718" y="248" font-size="15" fill="#475569">runs / run_prompts / events</text>
<text x="718" y="272" font-size="15" fill="#475569">輸入分配、固定版本、執行事實</text>
<text x="718" y="296" font-size="15" fill="#475569">接收標準結果與問題</text>
<path d="M655 230 H700" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<path d="M700 290 H655" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="370" y="365" font-size="17" fill="#3730a3">message ↔ run_prompts ↔ run：N:M</text>
<rect x="350" y="405" width="305" height="80" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="368" y="434" font-size="19" fill="#0f172a" font-weight="600">userService</text>
<text x="368" y="463" font-size="15" fill="#475569">身份、角色、令牌</text>
<rect x="700" y="405" width="305" height="80" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="718" y="434" font-size="19" fill="#0f172a" font-weight="600">deviceService</text>
<text x="718" y="463" font-size="15" fill="#475569">設備、上報能力與本地版本</text>
<rect x="350" y="510" width="305" height="80" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="368" y="539" font-size="19" fill="#0f172a" font-weight="600">agentService</text>
<text x="368" y="568" font-size="15" fill="#475569">Agent 版本與 Skill 版本引用</text>
<rect x="700" y="510" width="305" height="80" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="718" y="539" font-size="19" fill="#0f172a" font-weight="600">fileService</text>
<text x="718" y="568" font-size="15" fill="#475569">conversations/ 與 skills/ 字節存儲</text>
<rect x="350" y="615" width="305" height="80" rx="12" fill="#fffbeb" stroke="#cbd5e1"/>
<text x="368" y="644" font-size="19" fill="#0f172a" font-weight="600">skillService</text>
<text x="368" y="673" font-size="15" fill="#475569">skills / skill_versions / ZIP 發佈</text>
<rect x="700" y="615" width="305" height="80" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="718" y="644" font-size="19" fill="#0f172a" font-weight="600">workService</text>
<text x="718" y="673" font-size="15" fill="#475569">工作、協調線程與結果彙總</text>
<path d="M500 590 V615" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<path d="M655 655 H678 V550 H700" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="350" y="750" width="655" height="95" rx="12" fill="#ecfdf5" stroke="#cbd5e1"/>
<text x="368" y="779" font-size="19" fill="#0f172a" font-weight="600">store · 業務元數據與不可變版本表</text>
<text x="368" y="808" font-size="15" fill="#475569">不含 harnesses 或 files 表；不保存 YAML / execution_spec</text>
<path d="M300 255 H350" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<path d="M300 520 H325 V385 H855 V405" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="1110" y="115" width="425" height="765" rx="12" fill="#f5fff9" stroke="#cbd5e1"/>
<text x="1130" y="150" font-size="20" fill="#065f46" font-weight="600">Device · Client 本地執行</text>
<rect x="1130" y="200" width="385" height="200" rx="12" fill="#ecfdf5" stroke="#cbd5e1"/>
<text x="1148" y="229" font-size="19" fill="#0f172a" font-weight="600">harnessService</text>
<text x="1148" y="258" font-size="15" fill="#475569">harnessctl init/send/reply/cancel/status</text>
<text x="1148" y="282" font-size="15" fill="#475569">本地探測、啓動、原生交互</text>
<text x="1148" y="306" font-size="15" fill="#475569">解釋輸出、生成標準業務事件</text>
<text x="1148" y="330" font-size="15" fill="#475569">保留原生 RPC 與 hook 狀態</text>
<rect x="1130" y="490" width="385" height="155" rx="12" fill="#fffbeb" stroke="#cbd5e1"/>
<text x="1148" y="519" font-size="19" fill="#0f172a" font-weight="600">本地進程與通用原語</text>
<text x="1148" y="548" font-size="15" fill="#475569">進程樹 / stdin / stdout / stderr</text>
<text x="1148" y="572" font-size="15" fill="#475569">JSONL / JSON-RPC / 本地回調</text>
<text x="1148" y="596" font-size="15" fill="#475569">僅供 client 內部複用</text>
<rect x="1130" y="700" width="385" height="110" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="1148" y="729" font-size="19" fill="#0f172a" font-weight="600">Codex / Claude Code / 其他</text>
<text x="1148" y="758" font-size="15" fill="#475569">原生程序、橋接資源與業務 skill</text>
<text x="1148" y="782" font-size="15" fill="#475569">適配器包在本地；Skill 版本由 server 固定</text>
<path d="M1320 400 V490" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<path d="M1320 645 V700" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<path d="M1035 250 H1110" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="1039" y="231" font-size="13" fill="#475569">run</text>
<path d="M1110 355 H1035" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="1040" y="339" font-size="13" fill="#475569">事件</text>
<text x="30" y="929" font-size="17" fill="#475569">共享部分只保留 run 業務協議與 DTO；server 不設 harnessService，client 不訪問 server 數據庫。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1000" viewBox="0 0 1360 1000" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Server 调用拓扑</title><desc id="desc">CLI 装配 controller、hub、service 和 store。HTTP 与 WebSocket 入口调用 service，service 提交后经 Notifier 回调 hub。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="notify" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
<rect width="1360" height="1000" rx="16" fill="#fff"/>
<text x="30" y="35" text-anchor="start" font-size="23" fill="#0f172a" font-weight="600">Server：入口 → 业务 → 持久化</text>
<rect x="385" y="65" width="550" height="92" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="403" y="95" text-anchor="start" font-size="18" fill="#0f172a" font-weight="600">cli/server.go · runStart</text>
<text x="403" y="123" text-anchor="start" font-size="14" fill="#475569">创建 Store / Service / Hub / Controller，并注入 Notifier</text>
<path d="M660 157 V202" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="675" y="185" text-anchor="start" font-size="13" fill="#475569">装配（非请求路径）</text>
<rect x="30" y="215" width="260" height="200" rx="10" fill="#eef2ff" stroke="#818cf8"/>
<text x="48" y="245" text-anchor="start" font-size="18" fill="#3730a3" font-weight="600">controller · HTTP</text>
<text x="48" y="273" text-anchor="start" font-size="14" fill="#475569">api.go：鉴权 / 资源 / message</text>
<text x="48" y="297" text-anchor="start" font-size="14" fill="#475569">runs.go：会话与 run</text>
<text x="48" y="321" text-anchor="start" font-size="14" fill="#475569">attachments.go：文件 HTTP</text>
<text x="48" y="345" text-anchor="start" font-size="14" fill="#475569">server.go：路由与错误映射</text>
<text x="30" y="190" text-anchor="start" font-size="16" fill="#0f172a" font-weight="600">网页 · SDK · CLI → HTTP</text>
<rect x="30" y="475" width="260" height="178" rx="10" fill="#eef2ff" stroke="#818cf8"/>
<text x="48" y="505" text-anchor="start" font-size="18" fill="#3730a3" font-weight="600">hub · WebSocket</text>
<text x="48" y="533" text-anchor="start" font-size="14" fill="#475569">hello / ready / heartbeat / event</text>
<text x="48" y="557" text-anchor="start" font-size="14" fill="#475569">连接池与 idle 状态</text>
<text x="48" y="581" text-anchor="start" font-size="14" fill="#475569">ClaimRun → dispatch</text>
<text x="48" y="605" text-anchor="start" font-size="14" fill="#475569">实现 service.Notifier</text>
<rect x="385" y="215" width="550" height="470" rx="10" fill="#eef2ff" stroke="#818cf8"/>
<text x="403" y="245" text-anchor="start" font-size="18" fill="#3730a3" font-weight="600">一个 service.Service</text>
<text x="403" y="273" text-anchor="start" font-size="14" fill="#475569">业务按文件组织，共用连接和事务机制</text>
<rect x="405" y="300" width="510" height="80" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="423" y="330" text-anchor="start" font-size="18" fill="#0f172a" font-weight="600">用户 / 资源</text>
<text x="423" y="358" text-anchor="start" font-size="14" fill="#475569">users.go · agents.go · harnesses.go · daemons.go</text>
<rect x="405" y="395" width="510" height="100" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="423" y="425" text-anchor="start" font-size="18" fill="#0f172a" font-weight="600">共享会话 / 执行</text>
<text x="423" y="453" text-anchor="start" font-size="14" fill="#475569">sessions.go · runs.go · run_lifecycle.go</text>
<text x="423" y="477" text-anchor="start" font-size="14" fill="#475569">run_events.go · session_snapshot.go · questions.go</text>
<rect x="405" y="510" width="510" height="80" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="423" y="540" text-anchor="start" font-size="18" fill="#0f172a" font-weight="600">工作 / 附件</text>
<text x="423" y="568" text-anchor="start" font-size="14" fill="#475569">works.go · run_work.go · attachments.go / attachment_files.go</text>
<text x="425" y="625" text-anchor="start" font-size="16" fill="#92400e" font-weight="600">notifications.go：成功提交后通知</text>
<text x="425" y="653" text-anchor="start" font-size="15" fill="#475569">background.go：租约回收 / 孤儿文件清理</text>
<rect x="1040" y="215" width="290" height="235" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="1058" y="245" text-anchor="start" font-size="18" fill="#065f46" font-weight="600">store · SQLite</text>
<text x="1058" y="273" text-anchor="start" font-size="14" fill="#475569">store.go：连接 / Tx / 基础 schema</text>
<text x="1058" y="297" text-anchor="start" font-size="14" fill="#475569">run_schema.go / attachment_schema.go</text>
<text x="1058" y="321" text-anchor="start" font-size="14" fill="#475569">queries.go：SQL 文本</text>
<text x="1058" y="345" text-anchor="start" font-size="14" fill="#475569">scanners.go：行解码</text>
<text x="1058" y="369" text-anchor="start" font-size="14" fill="#475569">models.go / seed.go</text>
<rect x="1040" y="490" width="290" height="82" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="1058" y="520" text-anchor="start" font-size="18" fill="#065f46" font-weight="600">SQLite 主库</text>
<text x="1058" y="548" text-anchor="start" font-size="14" fill="#475569">19 张业务表 · 单连接 · WAL</text>
<rect x="1040" y="635" width="290" height="100" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="1058" y="665" text-anchor="start" font-size="18" fill="#065f46" font-weight="600">附件文件系统</text>
<text x="1058" y="693" text-anchor="start" font-size="14" fill="#475569">&lt;dir&gt;/&lt;session&gt;/&lt;attachment&gt;/content</text>
<text x="1058" y="717" text-anchor="start" font-size="14" fill="#475569">service 负责发布与清理</text>
<path d="M290 315 H385" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="306" y="300" text-anchor="start" font-size="12" fill="#475569">方法调用</text>
<path d="M290 510 H385" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="306" y="495" text-anchor="start" font-size="12" fill="#475569">方法调用</text>
<path d="M935 330 H1040" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="947" y="310" text-anchor="start" font-size="12" fill="#475569">SQL / Tx</text>
<path d="M1185 450 V490" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M935 670 H1040" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="950" y="655" text-anchor="start" font-size="12" fill="#475569">文件 I/O</text>
<path d="M385 625 H335 V580 H290" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#notify)"/>
<text x="310" y="710" text-anchor="start" font-size="15" fill="#92400e">Notifier：提交后 Kick / steer / cancel / answer / disconnect</text>
<rect x="30" y="755" width="260" height="105" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="48" y="785" text-anchor="start" font-size="18" fill="#0f172a" font-weight="600">daemon · 用户机器</text>
<text x="48" y="813" text-anchor="start" font-size="14" fill="#475569">接收 run / steer / answer / cancel</text>
<text x="48" y="837" text-anchor="start" font-size="14" fill="#475569">返回 ready / heartbeat / event</text>
<path d="M130 653 V755" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M195 755 V653" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="210" y="742" text-anchor="start" font-size="13" fill="#475569">WS</text>
<rect x="385" y="775" width="550" height="85" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="403" y="805" text-anchor="start" font-size="18" fill="#0f172a" font-weight="600">前端与安装下载</text>
<text x="403" y="833" text-anchor="start" font-size="14" fill="#475569">web.go → frontend/embed.go；setup.go → 下载目录</text>
<text x="30" y="920" text-anchor="start" font-size="16" fill="#475569">实线：调用或数据访问     虚线：Notifier 回调（service 不 import hub）</text>
<text x="30" y="952" text-anchor="start" font-size="16" fill="#475569">controller 与 hub 都调用 service；当前 controller 不直接访问 store。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1020" viewBox="0 0 1400 1020" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">本地插话：适配器处理原生协议</title><desc id="desc">Server 仅传业务补充输入。Client 本地 harnessService 经 harnessctl 分别对接 Codex 与 Claude Code，原生交互不跨设备边界。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="1400" height="1020" rx="16" fill="white"/>
<text x="30" y="40" font-size="24" fill="#0f172a" font-weight="600">插话：业务跨网络，原生协议只在本地</text>
<rect x="475" y="65" width="900" height="820" rx="12" fill="#f5fff9" stroke="#cbd5e1"/>
<text x="495" y="92" font-size="16" fill="#065f46" font-weight="600">Device 本地</text>
<rect x="45" y="105" width="305" height="65" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="63" y="134" font-size="19" fill="#0f172a" font-weight="600">Server · runService</text>
<rect x="515" y="105" width="345" height="65" rx="12" fill="#ecfdf5" stroke="#cbd5e1"/>
<text x="533" y="134" font-size="19" fill="#0f172a" font-weight="600">Client · harnessctl 适配器</text>
<rect x="1000" y="105" width="345" height="65" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="1018" y="134" font-size="19" fill="#0f172a" font-weight="600">原生程序 / 本地桥接</text>
<path d="M197 170 V860" stroke="#cbd5e1" stroke-dasharray="5 5"/>
<path d="M687 170 V860" stroke="#cbd5e1" stroke-dasharray="5 5"/>
<path d="M1172 170 V860" stroke="#cbd5e1" stroke-dasharray="5 5"/>
<text x="30" y="215" font-size="19" fill="#3730a3" font-weight="600">Codex：Client 本地发送原生 steer</text>
<path d="M197 265 H687" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="210" y="252" font-size="14" fill="#475569">① 业务输入分配 + conversation / agent</text>
<path d="M687 320 H1172" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="700" y="307" font-size="14" fill="#475569">② 本地 turn/steer → 当前 thread/turn</text>
<path d="M1172 375 H687" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="700" y="362" font-size="14" fill="#475569">③ 本地匹配请求的原生成功响应 / 错误</text>
<path d="M687 430 H197" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="210" y="417" font-size="14" fill="#475569">④ 标准接受确认 / 保留输入，原生帧不上传</text>
<text x="30" y="490" font-size="19" fill="#3730a3" font-weight="600">Claude Code：适配器发送 stream-json 输入</text>
<path d="M197 540 H687" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="210" y="527" font-size="14" fill="#475569">① 业务补充输入，加入本地待处理队列</text>
<path d="M1172 595 H687" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="700" y="582" font-size="14" fill="#475569">② 本地 stream-json 接收后续 user 输入</text>
<path d="M687 650 H1172" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="700" y="637" font-size="14" fill="#475569">③ 原生 command_lifecycle.started / user_message_uuids</text>
<path d="M1172 705 H687" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="700" y="692" font-size="14" fill="#475569">④ 匹配原生受理证据，绑定实际 run / input</text>
<path d="M687 760 H197" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="210" y="747" font-size="14" fill="#475569">⑤ 上传 accepted；UUID 由适配器决定</text>
<text x="30" y="915" font-size="17" fill="#475569">提问同理：本地原生请求 → 公共 request → reply(answer) → 本地回复原生请求。</text>
<text x="30" y="963" font-size="17" fill="#92400e">Server 转发输入和公共事件；插话或排队由适配器决定，重连不重新执行输入。</text>
</svg>

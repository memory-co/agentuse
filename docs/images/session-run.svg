<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" font-family="-apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Session 与 Run 的关系</title><desc id="desc">Session 包含共享消息和多个 run。用户消息为各目标 run 生成 run_prompts 内容副本，一个 run 可处理多个副本。每次领取 run 生成一个 attempt。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="1120" height="800" rx="16" fill="white"/>
<text x="35" y="36" font-size="23" fill="#334155">共享历史 → 任务分配 → 实际执行</text>
<rect x="360" y="65" width="400" height="125" rx="10" fill="#eef2ff" stroke="#94a3b8"/>
<text x="380" y="98" font-size="21" fill="#334155">Session</text>
<text x="380" y="130" font-size="15" fill="#334155">共享消息与附件，不绑定一个 agent</text>
<text x="380" y="156" font-size="15" fill="#334155">同 session + agent 最多一个活跃 run</text>
<rect x="40" y="275" width="430" height="145" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="60" y="308" font-size="21" fill="#334155">Message</text>
<text x="60" y="340" font-size="15" fill="#334155">用户内容或最终 assistant 结果</text>
<text x="60" y="366" font-size="15" fill="#334155">reply_to_message_id 指向被回复消息</text>
<text x="60" y="392" font-size="15" fill="#334155">消息不等于 run，也不保证触发执行</text>
<rect x="650" y="275" width="430" height="145" rx="10" fill="#eef2ff" stroke="#94a3b8"/>
<text x="670" y="308" font-size="21" fill="#334155">Run</text>
<text x="670" y="340" font-size="15" fill="#334155">某 agent 在本 session 承担的一次任务</text>
<text x="670" y="366" font-size="15" fill="#334155">message_id 是主任务，不是全部输入</text>
<text x="670" y="392" font-size="15" fill="#334155">一个 run 可处理多条 run_prompts</text>
<rect x="40" y="495" width="430" height="145" rx="10" fill="#ecfdf5" stroke="#94a3b8"/>
<text x="60" y="528" font-size="21" fill="#334155">run_prompts</text>
<text x="60" y="560" font-size="15" fill="#334155">一条原始消息 × 一个目标 run</text>
<text x="60" y="586" font-size="15" fill="#334155">冗余 content / format，记录消费状态</text>
<text x="60" y="612" font-size="15" fill="#334155">归属固定；后续 run 创建新的副本</text>
<rect x="650" y="495" width="430" height="145" rx="10" fill="#fffbeb" stroke="#94a3b8"/>
<text x="670" y="528" font-size="21" fill="#334155">Attempt</text>
<text x="670" y="560" font-size="15" fill="#334155">每次领取 run 生成新的执行身份</text>
<text x="670" y="586" font-size="15" fill="#334155">重试：同 run_id，换 attempt_id</text>
<text x="670" y="612" font-size="15" fill="#334155">当前身份存在 run；没有独立 attempts 表</text>
<path d="M440 190 V230 H255 V275" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="270" y="257" font-size="15" fill="#334155">1 : N</text>
<path d="M680 190 V230 H865 V275" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="880" y="257" font-size="15" fill="#334155">1 : N</text>
<path d="M255 420 V495" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="270" y="463" font-size="15" fill="#334155">用户消息 → 0..N 个目标</text>
<path d="M470 568 H555 V345 H650" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="570" y="380" font-size="15" fill="#334155">N : 1</text>
<text x="570" y="407" font-size="13" fill="#334155">关联 run</text>
<path d="M865 420 V495" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="880" y="463" font-size="15" fill="#334155">每次领取 / 重新领取</text>
<text x="40" y="702" font-size="16" fill="#334155">例：M1 @coder @reviewer → P1 / R1 与 P2 / R2；运行中 M2 @coder → P3 / R1。</text>
<text x="40" y="738" font-size="16" fill="#334155">插话回退：从 P3 复制 P4 给 R3，P3 留在 R1；执行重试：R1 的 A1 换成 A2。</text>
</svg>

name: claude
display_name: Claude Code
description: Anthropic Claude Code CLI(claude -p)

# 本机可执行文件，daemon.json 的 harnesses.claude.command 可以覆盖
command: claude

# 探测：能在 PATH 里找到 command 就算可用;version 的输出第一行记成 daemon_harnesses.version
detect:
  version: [--version]

# 每条消息起一次进程。{prompt} {resume} {args} 是占位符，见 docs/v2/designs/harness.md
# prompt 不走参数，走 stdin(见 input)。不让它弹权限确认;
# --permission-prompt-tool stdio 打开 AskUserQuestion,提问走 stdin/stdout 的 can_use_tool(见 ask)
run:
  new:    [-p, --input-format, stream-json, --output-format, stream-json, --verbose,
           --permission-mode, bypassPermissions, --permission-prompt-tool, stdio, "{args}"]
  resume: [-p, --input-format, stream-json, --output-format, stream-json, --verbose,
           --permission-mode, bypassPermissions, --permission-prompt-tool, stdio,
           --resume, "{resume}", "{args}"]

# stdin 写一行 JSON 作为这条消息;看到 result 行后关掉 stdin,进程退出
input:
  format: stream-json
  message: { type: user, message: { role: user, content: "{prompt}" } }

# 计划(docs/v2/designs/plan.md):-p 模式默认没有 TaskCreate / TaskUpdate,要打开;
# 任务清单默认跟着 Claude 会话走，续接时编号接着上次的，所以每条消息用一个新的清单，编号从 1 开始
env:
  CLAUDE_CODE_ENABLE_TODO_TOOLS: "1"
  CLAUDE_CODE_TASK_LIST_ID: "agentuse-{message_id}"

# 插话：在 stdin 注册 PreToolUse / Stop hook,回调时把插话塞进去(docs/v2/designs/steer.md)
steer: claude-hooks

# 提问：AskUserQuestion 来问时报给服务，等用户回答再回(docs/v2/designs/question.md)
ask: claude-permission

# 起进程前把本目录下的子目录拷进会话目录(每次覆盖，保证是当前版本)
workdir:
  skills: .claude/skills

# 会话在工作里时，工作的说明写成这个文件(docs/v2/designs/work.md);每条消息都重写，没有说明就删掉
instructions: CLAUDE.md

# stdout 每行一个 JSON,按规则从上往下匹配
output:
  format: jsonl
  session_id: session_id            # 任何一行带这个字段就记下来
  rules:
    - match: { type: assistant }
      each: message.content         # 对数组里每一项再匹配
      rules:
        - match: { type: text }
          progress: "{text}"
        # 计划(docs/v2/designs/plan.md):老版本 TodoWrite 每次给整份，新版本 TaskCreate / TaskUpdate 增量
        - match: { type: tool_use, name: TodoWrite }
          plan: { steps: input.todos, text: content, status: status }
          final: true
        - match: { type: tool_use, name: TaskCreate }
          plan_add: { text: input.subject }
          final: true
        - match: { type: tool_use, name: TaskUpdate }
          plan_update: { id: input.taskId, status: input.status }
          final: true
        # 提问显示成问题卡片(question 回报),不再出一行进度
        - match: { type: tool_use, name: AskUserQuestion }
          final: true
        - match: { type: tool_use }
          progress: "🔧 {name} {input}"
    - match: { type: result }
      result:
        ok: { subtype: success, is_error: false }
        output: result
        error: subtype
        cost_usd: total_cost_usd

# 收尾：没出现 result 行就算失败;有 result 但退出码非 0 也算失败
finish:
  require_result: true

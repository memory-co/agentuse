apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentuse-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentuse
  labels:
    app.kubernetes.io/name: agentuse
    app.kubernetes.io/instance: agentuse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agentuse
      app.kubernetes.io/instance: agentuse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentuse
        app.kubernetes.io/instance: agentuse
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/memory-co/agentuse-server:main
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: AGENTUSE_PUBLIC_URL
              value: "http://localhost:8080"
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /, port: http}
          livenessProbe:
            httpGet: {path: /, port: http}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agentuse-data
---
apiVersion: v1
kind: Service
metadata:
  name: agentuse
  labels:
    app.kubernetes.io/name: agentuse
    app.kubernetes.io/instance: agentuse
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agentuse
    app.kubernetes.io/instance: agentuse
  ports:
    - name: http
      port: 8080
      targetPort: http
